<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoryAI - Cartoon Story Maker</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#0f1020;color:white;
}
.container{max-width:850px;margin:auto;padding:20px}
header{text-align:center;padding:25px 5px}
.logo{
 font-size:36px;font-weight:bold;
 background:linear-gradient(90deg,#8b5cf6,#00d4ff);
 color:transparent;background-clip:text;
}
.sub{color:#aaa;margin-top:8px}
.card{
 background:#191b31;padding:20px;margin-top:18px;
 border-radius:18px;border:1px solid #30334d;
}
label{display:block;font-weight:bold;margin:15px 0 7px}
textarea,input,select{
 width:100%;padding:14px;border-radius:12px;
 border:1px solid #414562;background:#101224;
 color:white;font-size:16px;
}
textarea{min-height:110px}
button{
 border:0;border-radius:12px;padding:13px 18px;
 font-weight:bold;cursor:pointer;
}
.generate{
 width:100%;margin-top:18px;
 background:linear-gradient(90deg,#7c3aed,#06b6d4);
 color:white;font-size:17px;
}
.result{margin-top:20px}
.scene{
 background:#101224;margin:12px 0;padding:15px;
 border-radius:14px;border-left:4px solid #8b5cf6;
}
.copy{
 background:#303553;color:white;
 padding:7px 10px;float:right;
}
.hidden{display:none}
.footer{text-align:center;color:#777;margin:25px}
</style>
</head>
